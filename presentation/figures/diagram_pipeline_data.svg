-weight="normal" fill="#1B2631"><tspan x="555.0" y="32.6">Resize once to 256²</tspan><tspan x="555.0" y="50.0">image: bilinear</tspan><tspan x="555.0" y="67.4">mask: nearest (stays 0/1)</tspan></text><path d="M 434,50 L 452,50" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="676" y="6" width="206" height="88" rx="6" fill="#FDE2DE" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="779.0" y="32.6">Mask clean-up</tspan><tspan x="779.0" y="50.0">&gt; half of max value</tspan><tspan x="779.0" y="67.4">(JPEG noise at edges)</tspan></text><path d="M 658,50 L 676,50" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="900" y="6" width="206" height="88" rx="6" fill="#D5F5E3" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1003.0" y="32.6">Kept in RAM</tspan><tspan x="1003.0" y="50.0">pixels ÷ 255 → [0, 1]</tspan><tspan x="1003.0" y="67.4">returns (image, mask, i)</tspan></text><path d="M 882,50 L 900,50" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="1124" y="6" width="206" height="88" rx="6" fill="#FBF0C4" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1227.0" y="32.6">DataLoader</tspan><tspan x="1227.0" y="50.0">batch 8, shuffle (train)</tspan><tspan x="1227.0" y="67.4">index i → memory slot</tspan></text><path d="M 1106,50 L 1124,50" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/></svg>