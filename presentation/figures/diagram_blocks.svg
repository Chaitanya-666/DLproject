A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1185.0" y="359.9">3×3 Conv → BN → ReLU</tspan><tspan x="1185.0" y="376.1">attended half  C/2</tspan></text><path d="M 1185,296 L 1185,340" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="705" y="412" width="280" height="56" rx="6" fill="#D6EAF8" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="845.0" y="431.9">3×3 Conv → BN → ReLU</tspan><tspan x="845.0" y="448.1">plain half  C/2 (sees everything)</tspan></text><path d="M 577,306 L 577,440 L 705,440" fill="none" stroke="#0E3B43" stroke-width="1.8" marker-end="url(#a0E3B43)"/><rect x="1060" y="470" width="250" height="46" rx="6" fill="#FBF0C4" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" fill="#1B2631"><tspan x="1185.0" y="493.0">Concat → C×h×w</tspan></text><path d="M 1185,396 L 1185,470" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 985,440 L 1020,440 L 1020,493 L 1060,493" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="1060" y="560" width="250" height="46" rx="6" fill="#E6F2F3" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1185.0" y="583.0">Output → next layer</tspan></text><path d="M 1185,516 L 1185,560" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="490" y="500" width="525" height="185" rx="8" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="504" y="519.9">Why two halves? If M is wrong, the plain half still</tspan><tspan x="504" y="536.0">carries every feature, so a bad mask cannot erase the</tspan><tspan x="504" y="552.1">polyp; the next layers learn how much to trust each half.</tspan></text><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#E0604F"><tspan x="504" y="606.9">Found in the code: the &gt; 0.5 step has no gradient, so the</tspan><tspan x="504" y="623.1">fmask convs (982,088 parameters, 13%) never train.</tspan></text></svg>