amily="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="577.5" y="79.9">Previous mask M</tspan><tspan x="577.5" y="96.1">1×256×256</tspan></text><rect x="705" y="60" width="215" height="56" rx="6" fill="#E3E7EA" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="812.5" y="79.9">MaxPool (256/h)×(256/w)</tspan><tspan x="812.5" y="96.1">→ M_p  1×h×w</tspan></text><path d="M 665,88 L 705,88" fill="none" stroke="#E0604F" stroke-width="1.8" marker-end="url(#aE0604F)"/><rect x="490" y="250" width="175" height="56" rx="6" fill="#E6F2F3" stroke="#0E3B43" stroke-width="1.6"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="577.5" y="269.9">Feature map F</tspan><tspan x="577.5" y="286.1">C×h×w</tspan></text><rect x="705" y="160" width="280" height="56" rx="6" fill="#E8DAEF" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="845.0" y="179.9">fmask head: 3×3 Conv → BN → ReLU</tspan><tspan x="845.0" y="196.1">→ 1×1 Conv → Sigmoid</tspan></text><rect x="1005" y="160" width="120" height="56" rx="6" fill="#FDE2DE" stroke="#E0604F" stroke-width="1.6"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1065.0" y="179.9">Threshold</tspan><tspan x="1065.0" y="196.1">&gt; 0.5 → M_f</tspan></text><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#E0604F" font-style="italic"><ts