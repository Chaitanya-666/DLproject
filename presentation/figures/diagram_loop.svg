<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="660" viewBox="0 0 1330 660"><defs><marker id="a1B2631" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2631"/></marker><marker id="a0F7C86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C86"/></marker><marker id="aE0604F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0604F"/></marker><marker id="a5A6B7B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/></marker></defs><rect width="1330" height="660" fill="#fff"/><rect x="8" y="8" width="1314" height="372" rx="10" fill="#FAFCFC" stroke="#C9D6D8" stroke-width="1"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" text-anchor="start" dominant-baseline="central" font-weight="bold" fill="#0E3B43"><tspan x="22" y="30.0">Training: one epoch (repeated until no val improvement for 40 epochs; best = epoch 107 of 147)</tspan></text><rect x="22" y="85" width="165" height="64" rx="6" fill="#E6F2F3" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="104.5" y="108.9">Train set: 880</tspan><tspan x="104.5" y="125.1">shuffled, batch 8</tspan></text><rect x="215" y="85" width="235" height="64" rx="6" fill="#E3E7EA" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="332.5" y="102.1">Augment (p 0.3 each)</tspan><tspan x="332.5" y="117.0">rotate ±35°, flips: image + GT</tspan><tspan x="332.5" y="131.9">cutout holes: image only</tspan></text><rect x="480" y="85" width="170" height="64" rx="6" fill="#0F7C86" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" fill="#fff"><tspan x="565.0" y="108.3">FANet</tspan><tspan x="565.0" y="125.7">(image, prev mask)</tspan></text><rect x="680" y="85" width="165" height="64" rx="6" fill="#E8DAEF" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="762.5" y="108.9">Probabilities</tspan><tspan x="762.5" y="125.1">sigmoid(logits)</tspan></text><rect x="875" y="85" width="205" height="64" rx="6" fill="#FDE2DE" stroke="#E0604F" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="977.5" y="108.9">Loss vs ground truth</tspan><tspan x="977.5" y="125.1">0.5·BCE + 0.5·Dice</tspan></text><rect x="1110" y="85" width="195" height="64" rx="6" fill="#D6EAF8" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1207.5" y="108.9">Backward + Adam</tspan><tspan x="1207.5" y="125.1">lr 1e-4, batch of 8</tspan></text><path d="M 187,117.0 L 215,117.0" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 450,117.0 L 480,117.0" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 650,117.0 L 680,117.0" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 845,117.0 L 875,117.0" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 1080,117.0 L 1110,117.0" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 1207,85 L 1207,58 L 565,58 L 565,85" fill="none" stroke="#0F7C86" stroke-width="1.8" marker-end="url(#a0F7C86)"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#0F7C86"><tspan x="886" y="46.0">update the weights (every batch)</tspan></text><rect x="480" y="215" width="170" height="72" rx="6" fill="#FDE8E4" stroke="#E0604F" stroke-width="1.6"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="565.0" y="236.1">Mask memory</tspan><tspan x="565.0" y="251.0">880 × 1×256×256</tspan><tspan x="565.0" y="265.9">Otsu before epoch 1</tspan></text><path d="M 565,215 L 565,149" fill="none" stroke="#E0604F" stroke-width="1.8" marker-end="url(#aE0604F)"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#E0604F"><tspan x="573" y="171.2">get(idx): looked up by</tspan><tspan x="573" y="184.8">image index; NOT rotated</tspan></text><rect x="680" y="215" width="165" height="72" rx="6" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="1.2" stroke-dasharray="5 4"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="762.5" y="243.6">Staging copy</tspan><tspan x="762.5" y="258.4">stage(idx, probs &gt; 0.5)</tspan></text><path d="M 762,149 L 762,215" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="875" y="215" width="205" height="72" rx="6" fill="#FBF0C4" stroke="#F2B134" stroke-width="1.8"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="977.5" y="234.9">End of epoch:</tspan><tspan x="977.5" y="251.0">val loss (120 images)</tspan><tspan x="977.5" y="267.1">improved?</tspan></text><path d="M 845,251 L 875,251" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><rect x="1110" y="196" width="195" height="52" rx="6" fill="#D5F5E3" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1207.5" y="214.6">Yes → commit:</tspan><tspan x="1207.5" y="229.4">memory ← staging; save best.pt</tspan></text><rect x="1110" y="262" width="195" height="52" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1B2631"><tspan x="1207.5" y="280.6">No → keep old memory;</tspan><tspan x="1207.5" y="295.4">LR ×0.1 after 5, stop after 40</tspan></text><path d="M 1080,235 L 1110,222" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 1080,267 L 1110,288" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#a1B2631)"/><path d="M 1305,222 L 1318,222 L 1318,345 L 565,345 L 565,287" fill="none" stroke="#E0604F" stroke-width="1.8" marker-end="url(#aE0604F)"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#E0604F"><tspan x="940" y="360.0">next epoch: each image gets its own last good prediction as the hint</tspan></text><rect x="8" y="392" width="1314" height="260" rx="10" fill="#FAFCFC" stroke="#C9D6D8" stroke-width="1"/><text font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" text-anchor="start" dominant-baseline="central" font-weight="bold" fill="#0E3B43"><tspan x="22" y="414.0">Testing: weights frozen (no loss, no backward), 10 refinement rounds per image</tspan></text><rect x